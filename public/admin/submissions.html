<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DogNav 提交审核</title>
    <link rel="stylesheet" href="/admin/admin.css">
    <style>        th { background: #f8f9fa; padding: 12px 16px; text-align: left; font-weight: 600; color: #555; font-size: 13px; border-bottom: 2px solid #eee; }
        
        tr:hover { background: #f8f9fa; }

        .badge-approved { background: #e8f5e9; color: #2e7d32; }
        .badge-rejected { background: #ffebee; color: #c62828; }
        .btn-approve, .btn-reject { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; margin-right: 4px; }
        .btn-approve { background: #e8f5e9; color: #2e7d32; }
        .btn-reject { background: #ffebee; color: #c62828; }
        .note-input { width: 140px; padding: 5px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; margin-right: 6px; vertical-align: middle; }
        .note-input:focus { outline: none; border-color: #667eea; }

        .modal { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .modal h2 { margin: 0 0 20px; font-size: 18px; }
        .modal .form-group { margin-bottom: 16px; }
        .modal .form-group label { display: block; margin-bottom: 6px; font-weight: 500; color: #555; font-size: 13px; }
        .modal .form-group input, .modal .form-group select, .modal .form-group textarea {
            width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: inherit;
        }
        .modal .form-group input:focus, .modal .form-group select:focus, .modal .form-group textarea:focus { outline: none; border-color: #667eea; }
        .form-error { display: none; margin-top: 16px; padding: 10px 12px; background: #ffebee; color: #c62828; border-radius: 6px; font-size: 13px; }
        .form-error.show { display: block; }
        
        
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="logo">🐕</div>
            <div class="text">Dog<span>Nav</span></div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">内容管理</div>
            <a href="/admin/dashboard"><span class="icon">📋</span> 站点管理</a>
            <a href="/admin/categories"><span class="icon">📂</span> 分类管理</a>
            <a href="/admin/pages"><span class="icon">📄</span> 页面管理</a>
            <a href="/admin/links"><span class="icon">🔗</span> 友链管理</a>
            <div class="nav-section">互动管理</div>
            <a href="/admin/submissions" class="active"><span class="icon">📮</span> 提交审核</a>
            <a href="/admin/health"><span class="icon">🩺</span> 站点检测</a>
            <div class="nav-section">数据分析</div>
            <a href="/admin/stats"><span class="icon">📊</span> 统计看板</a>
            <a href="/admin/logs" data-role="admin"><span class="icon">📝</span> 操作日志</a>
            <div class="nav-section">系统</div>
            <a href="/admin/users" data-role="admin"><span class="icon">👥</span> 用户管理</a>
            <a href="/admin/backup" data-role="admin"><span class="icon">💾</span> 备份恢复</a>
            <a href="/admin/settings" data-role="admin"><span class="icon">⚙️</span> 系统设置</a>
        </nav>
        <div class="sidebar-footer">
            <a href="#"><span class="icon">🚪</span> 退出登录</a>
            <div class="sidebar-version">v3.1.0</div>
        </div>
    </aside>

    <div class="main">
        <div class="topbar">
            <h1>提交审核</h1>
            <div class="user-info">
                <div class="avatar">A</div>
                <span>Admin</span>
            </div>
        </div>
        <div class="container">
            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>网站名称</th>
                            <th>URL</th>
                            <th>描述</th>
                            <th>分类</th>
                            <th>提交者</th>
                            <th>状态</th>
                            <th>提交时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="submissionsBody"></tbody>
                </table>
                <div class="empty" id="emptyState" style="display:none">暂无提交</div>
            </div>
        </div>
    </div>

    <!-- ═══ 收录编辑模态框 ═══ -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2>确认收录</h2>
            <form id="approveForm">
                <div class="form-group"><label>网站名称 *</label><input type="text" id="apprName" required maxlength="50"></div>
                <div class="form-group"><label>描述</label><textarea id="apprDesc" rows="2" maxlength="200"></textarea></div>
                <div class="form-group"><label>图标 URL</label><input type="text" id="apprIcon" placeholder="https://（留空使用默认图标）"></div>
                <div class="form-group"><label>分类 *</label><select id="apprCategory" required></select></div>
                <div class="form-group"><label>审核备注</label><input type="text" id="apprNote" placeholder="选填"></div>
                <div class="form-error" id="apprError"></div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="apprCancel">取消</button>
                    <button type="submit" class="btn-save" id="apprSubmit">确认收录</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/admin/auth.js"></script>
    <script src="/admin/js/submissions.js"></script>
</body>
</html>
