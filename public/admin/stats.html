<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DogNav 统计看板</title>
    <link rel="stylesheet" href="/admin/admin.css">
    <style>        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .stat-card .value { font-size: 32px; font-weight: 700; color: #667eea; }
        .stat-card .label { font-size: 14px; color: #666; margin-top: 4px; }
        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-bottom: 24px; }
        .chart-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .chart-card h3 { font-size: 16px; color: #333; margin-bottom: 16px; }
        .popular-list { list-style: none; }
        .popular-list li { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
        .popular-list li:last-child { border-bottom: none; }
        .popular-list .name { font-weight: 500; color: #333; }
        .popular-list .count { color: #667eea; font-weight: 600; }
        .bar-chart { display: flex; flex-direction: column; gap: 12px; }
        .bar-item { display: flex; align-items: center; gap: 12px; }
        .bar-item .label { width: 80px; font-size: 13px; color: #666; text-align: right; }
        .bar-item .bar { flex: 1; height: 24px; background: #f0f0f0; border-radius: 12px; overflow: hidden; }
        .bar-item .bar-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 12px; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; color: white; font-size: 12px; font-weight: 600; min-width: 40px; }
        .nav-badge { margin-left: 6px; padding: 1px 8px; background: #ffebee; color: #c62828; border-radius: 10px; font-size: 11px; font-weight: 600; }
        
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="logo">🐕</div>
            <div class="text">Dog<span>Nav</span></div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">内容管理</div>
            <a href="/admin/dashboard"><span class="icon">📋</span> 站点管理</a>
            <a href="/admin/categories"><span class="icon">📂</span> 分类管理</a>
            <a href="/admin/pages"><span class="icon">📄</span> 页面管理</a>
            <a href="/admin/links"><span class="icon">🔗</span> 友链管理</a>
            <div class="nav-section">互动管理</div>
            <a href="/admin/submissions"><span class="icon">📮</span> 提交审核<span class="nav-badge" id="navPendingSubs" style="display:none"></span></a>
            <a href="/admin/health"><span class="icon">🩺</span> 站点检测</a>
            <a href="/admin/reports"><span class="icon">🚩</span> 举报管理</a>
            <div class="nav-section">数据分析</div>
            <a href="/admin/stats" class="active"><span class="icon">📊</span> 统计看板</a>
            <a href="/admin/logs" data-role="admin"><span class="icon">📝</span> 操作日志</a>
            <div class="nav-section">系统</div>
            <a href="/admin/users" data-role="admin"><span class="icon">👥</span> 用户管理</a>
            <a href="/admin/backup" data-role="admin"><span class="icon">💾</span> 备份恢复</a>
            <a href="/admin/settings" data-role="admin"><span class="icon">⚙️</span> 系统设置</a>
        </nav>
        <div class="sidebar-footer">
            <a href="#"><span class="icon">🚪</span> 退出登录</a>
            <div class="sidebar-version">v3.1.0</div>
        </div>
    </aside>

    <div class="main">
        <div class="topbar">
            <h1>统计看板</h1>
            <div class="user-info">
                <div class="avatar">A</div>
                <span>Admin</span>
            </div>
        </div>
        <div class="container">
            <div class="stats-grid" id="statsGrid"></div>
            <div class="charts-grid">
                <div class="chart-card">
                    <h3>热门站点 TOP 10</h3>
                    <ul class="popular-list" id="popularList"></ul>
                </div>
                <div class="chart-card">
                    <h3>分类分布</h3>
                    <div class="bar-chart" id="categoryChart"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/admin/auth.js"></script>
    <script src="/admin/js/stats.js"></script>
</body>
</html>
