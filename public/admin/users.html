<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DogNav 用户管理</title>
    <link rel="stylesheet" href="/admin/admin.css">
    <style>        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        
        .badge-admin { background: #fce4ec; color: #c62828; }
        .badge-editor { background: #e3f2fd; color: #1565c0; }

        .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-delete, .btn-toggle, .btn-role, .btn-reset { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .btn-delete { background: #ffebee; color: #c62828; }
        .btn-toggle { background: #fff3e0; color: #e65100; }
        .btn-role { background: #e3f2fd; color: #1565c0; }
        .btn-reset { background: #f3e5f5; color: #6a1b9a; }
        .card-actions button:disabled { opacity: 0.6; cursor: not-allowed; }

        .modal { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; }
        .modal h2 { margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }

        
    </style>
</head>
<body data-require-role="admin">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="logo">🐕</div>
            <div class="text">Dog<span>Nav</span></div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">内容管理</div>
            <a href="/admin/dashboard"><span class="icon">📋</span> 站点管理</a>
            <a href="/admin/categories"><span class="icon">📂</span> 分类管理</a>
            <a href="/admin/pages"><span class="icon">📄</span> 页面管理</a>
            <a href="/admin/links"><span class="icon">🔗</span> 友链管理</a>
            <div class="nav-section">互动管理</div>
            <a href="/admin/submissions"><span class="icon">📮</span> 提交审核</a>
            <a href="/admin/health"><span class="icon">🩺</span> 站点检测</a>
            <div class="nav-section">数据分析</div>
            <a href="/admin/stats"><span class="icon">📊</span> 统计看板</a>
            <a href="/admin/logs" data-role="admin"><span class="icon">📝</span> 操作日志</a>
            <div class="nav-section">系统</div>
            <a href="/admin/users" data-role="admin" class="active"><span class="icon">👥</span> 用户管理</a>
            <a href="/admin/backup" data-role="admin"><span class="icon">💾</span> 备份恢复</a>
            <a href="/admin/settings" data-role="admin"><span class="icon">⚙️</span> 系统设置</a>
        </nav>
        <div class="sidebar-footer">
            <a href="#"><span class="icon">🚪</span> 退出登录</a>
        </div>
    </aside>

    <div class="main">
        <div class="topbar">
            <h1>用户管理</h1>
            <div class="user-info">
                <div class="avatar">A</div>
                <span>Admin</span>
            </div>
        </div>
        <div class="container">
            <div class="toolbar">
                <div></div>
                <button class="btn-add" id="addUserBtn">+ 添加用户</button>
            </div>
            <div id="userList"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2>添加用户</h2>
            <form id="userForm">
                <div class="form-group"><label>用户名 *</label><input type="text" id="userName" required></div>
                <div class="form-group"><label>密码 *</label><input type="password" id="userPassword" required></div>
                <div class="form-group">
                    <label>角色</label>
                    <select id="userRole"><option value="editor">编辑</option><option value="admin">管理员</option></select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="userCancelBtn">取消</button>
                    <button type="submit" class="btn-save">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/admin/auth.js"></script>
    <script src="/admin/js/users.js"></script>
</body>
</html>
