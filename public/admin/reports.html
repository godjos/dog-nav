<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DogNav 举报管理</title>
    <link rel="stylesheet" href="/admin/admin.css">
    <style>        th { background: #f8f9fa; padding: 12px 16px; text-align: left; font-weight: 600; color: #555; font-size: 13px; }

        .badge-resolved { background: #e8f5e9; color: #2e7d32; }
        .btn-resolve { padding: 6px 12px; background: #e8f5e9; color: #2e7d32; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .pending-count { margin-left: 12px; padding: 3px 10px; background: #ffebee; color: #c62828; border-radius: 12px; font-size: 12px; font-weight: 600; vertical-align: middle; }
        .detail-cell { max-width: 220px; color: #666; font-size: 12px; word-break: break-all; }
        
        
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="logo">🐕</div>
            <div class="text">Dog<span>Nav</span></div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">内容管理</div>
            <a href="/admin/dashboard"><span class="icon">📋</span> 站点管理</a>
            <a href="/admin/categories"><span class="icon">📂</span> 分类管理</a>
            <a href="/admin/pages"><span class="icon">📄</span> 页面管理</a>
            <a href="/admin/links"><span class="icon">🔗</span> 友链管理</a>
            <div class="nav-section">互动管理</div>
            <a href="/admin/submissions"><span class="icon">📮</span> 提交审核</a>
            <a href="/admin/health"><span class="icon">🩺</span> 站点检测</a>
            <a href="/admin/reports" class="active"><span class="icon">🚩</span> 举报管理</a>
            <div class="nav-section">数据分析</div>
            <a href="/admin/stats"><span class="icon">📊</span> 统计看板</a>
            <a href="/admin/logs" data-role="admin"><span class="icon">📝</span> 操作日志</a>
            <div class="nav-section">系统</div>
            <a href="/admin/users" data-role="admin"><span class="icon">👥</span> 用户管理</a>
            <a href="/admin/backup" data-role="admin"><span class="icon">💾</span> 备份恢复</a>
            <a href="/admin/settings" data-role="admin"><span class="icon">⚙️</span> 系统设置</a>
        </nav>
        <div class="sidebar-footer">
            <a href="#"><span class="icon">🚪</span> 退出登录</a>
            <div class="sidebar-version">v3.1.0</div>
        </div>
    </aside>

    <div class="main">
        <div class="topbar">
            <h1>举报管理<span class="pending-count" id="pendingCount" style="display:none"></span></h1>
            <div class="user-info">
                <div class="avatar">A</div>
                <span>Admin</span>
            </div>
        </div>
        <div class="container">
            <div class="table-card">
                <table>
                    <thead>
                        <tr><th>网站</th><th>原因</th><th>补充说明</th><th>举报者</th><th>状态</th><th>时间</th><th>操作</th></tr>
                    </thead>
                    <tbody id="reportsBody"></tbody>
                </table>
                <div class="empty" id="emptyState" style="display:none">暂无举报</div>
            </div>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/admin/auth.js"></script>
    <script src="/admin/js/reports.js"></script>
</body>
</html>
