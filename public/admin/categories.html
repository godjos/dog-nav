<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DogNav 分类管理</title>
    <link rel="stylesheet" href="/admin/admin.css">
    <style>        .btn-delete-all { padding: 10px 20px; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .card-info { display: flex; align-items: center; gap: 16px; }
        .card-icon { font-size: 24px; }
        .card-name { font-weight: 600; color: #333; }
        .card-id { font-size: 12px; color: #888; }
        .card-actions { display: flex; gap: 8px; }
        .btn-edit, .btn-delete { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .btn-edit { background: #e3f2fd; color: #1976d2; }
        .btn-delete { background: #ffebee; color: #c62828; }

        .modal { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; }
        .modal h2 { margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }

        .tag-section { margin-top: 32px; }
        .tag-section h2 { font-size: 16px; color: #333; margin-bottom: 16px; }
        .tag-form { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
        .tag-form input[type="text"] { padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; width: 200px; }
        .tag-form input[type="color"] { width: 44px; height: 40px; padding: 2px; border: 1px solid #ddd; border-radius: 6px; background: white; cursor: pointer; }
        .tag-item { background: white; border-radius: 12px; padding: 14px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .tag-info { display: flex; align-items: center; gap: 12px; }
        .tag-color { width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.1); }
        .tag-name { font-weight: 600; color: #333; font-size: 14px; }
        .tag-empty { color: #999; font-size: 14px; padding: 20px 0; }
        .tag-item .card-actions button:disabled, .card-actions button:disabled { opacity: 0.6; cursor: not-allowed; }

        
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="logo">🐕</div>
            <div class="text">Dog<span>Nav</span></div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">内容管理</div>
            <a href="/admin/dashboard"><span class="icon">📋</span> 站点管理</a>
            <a href="/admin/categories" class="active"><span class="icon">📂</span> 分类管理</a>
            <a href="/admin/pages"><span class="icon">📄</span> 页面管理</a>
            <a href="/admin/links"><span class="icon">🔗</span> 友链管理</a>
            <div class="nav-section">互动管理</div>
            <a href="/admin/submissions"><span class="icon">📮</span> 提交审核</a>
            <a href="/admin/health"><span class="icon">🩺</span> 站点检测</a>
            <a href="/admin/reports"><span class="icon">🚩</span> 举报管理</a>
            <div class="nav-section">数据分析</div>
            <a href="/admin/stats"><span class="icon">📊</span> 统计看板</a>
            <a href="/admin/logs" data-role="admin"><span class="icon">📝</span> 操作日志</a>
            <div class="nav-section">系统</div>
            <a href="/admin/users" data-role="admin"><span class="icon">👥</span> 用户管理</a>
            <a href="/admin/backup" data-role="admin"><span class="icon">💾</span> 备份恢复</a>
            <a href="/admin/settings" data-role="admin"><span class="icon">⚙️</span> 系统设置</a>
        </nav>
        <div class="sidebar-footer">
            <a href="#"><span class="icon">🚪</span> 退出登录</a>
            <div class="sidebar-version">v3.2.0</div>
        </div>
    </aside>

    <div class="main">
        <div class="topbar">
            <h1>分类管理</h1>
            <div class="user-info">
                <div class="avatar">A</div>
                <span>Admin</span>
            </div>
        </div>
        <div class="container">
            <div class="toolbar">
                <div></div>
                <div>
                    <button class="btn-delete-all" id="deleteAllBtn" data-role="admin">清空全部分类</button>
                    <button class="btn-add" id="addCatBtn">+ 添加分类</button>
                </div>
            </div>
            <div id="categoryList"></div>

            <div class="tag-section">
                <h2>标签管理</h2>
                <form class="tag-form" id="tagForm">
                    <input type="text" id="tagName" placeholder="标签名称" required maxlength="50">
                    <input type="color" id="tagColor" value="#667eea" title="标签颜色">
                    <button type="submit" class="btn-add" id="tagSubmitBtn">+ 新建标签</button>
                    <button type="button" class="btn-cancel" id="tagCancelBtn" style="display:none">取消编辑</button>
                </form>
                <div id="tagList"></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="modalTitle">添加分类</h2>
            <form id="categoryForm">
                <div class="form-group">
                    <label>分类 ID *</label>
                    <input type="text" id="catId" required placeholder="如: video">
                </div>
                <div class="form-group">
                    <label>分类名称 *</label>
                    <input type="text" id="catName" required placeholder="如: 影视资源">
                </div>
                <div class="form-group">
                    <label>图标 (emoji)</label>
                    <input type="text" id="catIcon" placeholder="如: 🎬">
                </div>
                <div class="form-group">
                    <label>排序</label>
                    <input type="number" id="catSort" value="0" min="0">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="catCancelBtn">取消</button>
                    <button type="submit" class="btn-save">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/admin/auth.js"></script>
    <script src="/admin/js/categories.js"></script>
</body>
</html>
