<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DogNav - 精选网址导航 | 发现互联网的无限精彩</title>
    <meta name="description" content="DogNav 精选网址导航，收录146+优质网站，涵盖影视、动漫、软件、工具、资讯、社区、AI、开发、设计等10大分类，让发现好网站变得简单。">
    <meta name="keywords" content="网址导航,导航网站,精选导航,影视网站,动漫网站,AI工具,开发工具,设计素材,软件下载,在线工具">
    <meta name="author" content="CangDog">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://nav.cangdog.com/">
    <link rel="icon" href="/ico.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "DogNav",
        "url": "https://nav.cangdog.com/",
        "description": "精选网址导航，收录146+优质网站，涵盖影视、动漫、软件、工具、资讯、社区、AI、开发、设计等10大分类。",
        "potentialAction": {
            "@type": "SearchAction",
            "target": "https://nav.cangdog.com/?q={search_term_string}",
            "query-input": "required name=search_term_string"
        }
    }
    </script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="loader" id="loader">
    <div class="loader-spinner"></div>
    <div class="loader-label">DogNav</div>
</div>

<span class="top-clock" id="clock" aria-label="当前日期时间"></span>

<!-- ═══ 工作台首页（默认视图） ═══ -->
<main class="home" id="homeView">
    <section class="hero">
        <h1 class="greet" id="greet">晚上好</h1>
        <p class="greet-sub">专注当下，探索更大的可能</p>
    </section>

    <header class="search-sec">
        <div class="search-wrap">
            <button type="button" class="search-ico" id="searchIco" aria-haspopup="listbox" aria-expanded="false" title="搜索引擎">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            </button>
            <div class="eng-menu" id="engMenu" role="listbox" hidden></div>
            <input type="text" class="search-input" id="searchInput" placeholder="搜索网站、工具，或直接输入网址…" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="searchPanel" aria-autocomplete="list">
            <kbd class="search-kbd" id="searchKbd" aria-hidden="true">⌘ K</kbd>
            <button class="search-go" id="searchBtn" aria-label="搜索">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
            <div class="search-panel" id="searchPanel" role="listbox" aria-label="站内搜索结果" hidden></div>
        </div>
    </header>

    <section class="dock-sec" aria-label="常用应用">
        <div class="dock" id="dockBar"></div>
        <p class="dock-hint" id="dockHint" hidden>在「全部应用」中点卡片上的 📌，把常用站点固定到这里</p>
    </section>

    <section class="status-row" id="statusRow" aria-label="工作台状态">
        <div class="st-card" id="stRecent">
            <div class="st-label"><span class="st-label-t">🕘 最近使用</span><button type="button" class="st-more" data-open="recent" aria-label="查看全部最近使用">›</button></div>
            <div class="st-body st-recent-row" id="stRecentBody"></div>
        </div>
        <div class="st-card st-click" id="stRead" role="link" tabindex="0" aria-label="打开稍后阅读" hidden>
            <div class="st-label"><span class="st-label-t">🔖 稍后阅读</span><span class="st-more st-more-static">›</span></div>
            <div class="st-body"><span class="st-num" id="stReadNum">→</span></div>
        </div>
        <div class="st-card st-click" id="stFav" role="button" tabindex="0" aria-label="查看我的收藏">
            <div class="st-label"><span class="st-label-t">☆ 收藏</span><button type="button" class="st-more" data-open="fav" aria-label="查看全部收藏">›</button></div>
            <div class="st-body"><span class="st-num" id="stFavNum">0</span><span class="st-sub">个站点</span></div>
        </div>
        <div class="st-card st-click" id="stHealth" role="button" tabindex="0">
            <div class="st-label"><span class="st-label-t">🩺 服务状态</span><button type="button" class="st-more" data-open="health" aria-label="查看站点健康状态">›</button></div>
            <div class="st-body" id="stHealthBody"></div>
        </div>
        <div class="st-card" id="stTasks" role="status" hidden>
            <div class="st-label"><span class="st-label-t">📋 今日事项</span><span class="st-more st-more-static">›</span></div>
            <div class="st-body"><span class="st-num" id="stTasksNum">—</span><span class="st-sub">项</span></div>
        </div>
    </section>

    <section class="cat-sections" id="catSections" aria-label="分类导航"></section>
</main>

<!-- ═══ 全部应用（二级浏览视图：分类 + 精选/收藏/最近/热门/最新/热榜） ═══ -->
<main class="panel" id="allView" hidden>
    <div class="panel-head">
        <nav class="cat-nav" id="catNav" aria-label="站点分类">
            <div class="cat-pills" id="catPills"></div>
            <div class="cat-more" id="catMore" hidden>
                <button type="button" class="cat-pill cat-more-btn" id="catMoreBtn" aria-haspopup="true" aria-expanded="false">更多 ▾</button>
                <div class="cat-more-menu" id="catMoreMenu" hidden></div>
            </div>
            <button type="button" class="cat-drawer-btn" id="catDrawerBtn" aria-label="打开分类菜单">☰ 分类</button>
        </nav>
        <nav class="mode-nav" id="viewBar" aria-label="内容模式">
            <button class="cat-pill view-pill" data-view="featured">⭐ 精选</button>
            <button class="cat-pill view-pill" data-view="fav">❤️ 收藏</button>
            <button class="cat-pill view-pill" data-view="recent">🕘 最近</button>
            <button class="cat-pill view-pill" data-view="hot">🔥 热门</button>
            <button class="cat-pill view-pill" data-view="new">🆕 最新</button>
            <button class="cat-pill view-pill" data-view="trending">📈 热榜</button>
            <span class="tag-chip" id="tagFilterChip" hidden></span>
        </nav>
        <div class="tag-nav" id="tagNav" hidden></div>
    </div>
    <div class="cards-area" id="cardsArea"></div>
</main>

<nav class="bottom-nav" id="bottomNav" aria-label="页面工具">
    <button type="button" class="bn-btn" id="btnAllApps">⊞ 全部应用</button>
    <button type="button" class="bn-btn" id="btnRecentView">◷ 最近使用</button>
    <button type="button" class="bn-btn" id="btnSettings" aria-haspopup="true" aria-expanded="false">⚙ 设置</button>
</nav>

<div class="set-pop" id="setPop" role="menu" hidden>
    <div class="set-item set-theme-row">
        <span class="set-label">主题</span>
        <div class="set-seg" role="group" aria-label="主题切换">
            <button type="button" data-set-theme="dark">深色</button>
            <button type="button" data-set-theme="light">浅色</button>
        </div>
    </div>
    <button type="button" class="set-item set-clear" id="setClearData">清除本地数据</button>
    <div class="set-links" id="setLinks">
        <a href="links.html">友链</a>
        <a href="about.html">关于</a>
        <a href="contribute.html">提交</a>
    </div>
</div>

<div class="drawer-overlay" id="drawerOverlay" hidden></div>
<aside class="cat-drawer" id="catDrawer" aria-label="分类菜单" hidden>
    <div class="drawer-head">
        <span>浏览</span>
        <button type="button" class="drawer-close" id="drawerClose" aria-label="关闭分类菜单">✕</button>
    </div>
    <div class="drawer-sec">分类</div>
    <div class="drawer-cats" id="drawerCats"></div>
    <div class="drawer-sec">模式</div>
    <div class="drawer-modes" id="drawerModes"></div>
</aside>

<button class="btt" id="btt" aria-label="回到顶部">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 15l-6-6-6 6"/></svg>
</button>

<script src="/js/utils.js"></script>
<script src="/js/settings-loader.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
