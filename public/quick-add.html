<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快捷收藏 - Dog-Nav</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f7f9fc;
            color: #2d3748;
            font-size: 14px;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .quick-card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            border: 1px solid #edf2f7;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 14px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.3px;
        }
        .header-status {
            font-size: 12px;
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 8px;
            border-radius: 10px;
            color: #fff;
        }
        .content {
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group label {
            font-weight: 600;
            font-size: 13px;
            color: #4a5568;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .form-row {
            display: flex;
            gap: 10px;
        }
        .form-row .form-group {
            flex: 1;
        }
        input[type="text"], input[type="password"], input[type="number"], select, textarea {
            width: 100%;
            padding: 8px 11px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 13.5px;
            color: #2d3748;
            background: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }
        textarea {
            resize: vertical;
            min-height: 52px;
        }
        .url-input-wrap {
            position: relative;
            display: flex;
            gap: 8px;
        }
        .btn-sub {
            padding: 7px 12px;
            background: #edf2f7;
            border: 1px solid #cbd5e0;
            color: #4a5568;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            font-weight: 500;
        }
        .btn-sub:hover {
            background: #e2e8f0;
            color: #2d3748;
        }
        .icon-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }
        .icon-box {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: #fff;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .icon-box img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }
        .icon-box .emoji {
            font-size: 18px;
        }
        .icon-meta {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }
        .icon-meta-status {
            font-size: 12px;
            color: #4a5568;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .icon-meta-input {
            font-size: 12px;
            color: #718096;
            border: none;
            background: transparent;
            padding: 0;
            width: 100%;
            text-overflow: ellipsis;
        }
        .icon-meta-input:focus {
            outline: none;
            border-bottom: 1px dashed #667eea;
            box-shadow: none;
        }
        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 80px;
            overflow-y: auto;
            padding: 2px 0;
        }
        .tag-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            background: #edf2f7;
            color: #4a5568;
            cursor: pointer;
            user-select: none;
            transition: all 0.15s;
        }
        .tag-chip.active {
            background: #667eea;
            color: #ffffff;
        }
        .tag-chip .tag-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        .checkbox-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #4a5568;
            cursor: pointer;
        }
        .footer {
            padding: 14px 20px;
            background: #f8fafc;
            border-top: 1px solid #edf2f7;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-cancel {
            padding: 8px 16px;
            border: 1px solid #cbd5e0;
            background: #ffffff;
            color: #4a5568;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .btn-cancel:hover {
            background: #f1f5f9;
        }
        .btn-save {
            padding: 8px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: #ffffff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(102, 126, 234, 0.35);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-save:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.45);
        }
        .btn-save:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .error-msg {
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #dc2626;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12.5px;
            display: none;
        }
        .error-msg.show {
            display: block;
        }
        /* Result splash overlay */
        .splash-overlay {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            gap: 16px;
        }
        .splash-overlay.show {
            display: flex;
        }
        .splash-icon {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: #def7ec;
            color: #0e9f6e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .spinner {
            display: inline-block;
            width: 13px;
            height: 13px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="quick-card">
        <div class="header">
            <h1>📌 快捷收藏到 Dog-Nav</h1>
            <span class="header-status" id="headerStatus">检测登录...</span>
        </div>

        <!-- 登录表单（未登录时展示） -->
        <div id="loginView" class="content" style="display: none;">
            <div style="text-align: center; margin-bottom: 6px;">
                <h2 style="font-size: 16px; color: #333; margin-bottom: 4px;">管理员登录</h2>
                <p style="font-size: 13px; color: #718096;">登录后将永久保持此小窗的收藏权限</p>
            </div>
            <div class="error-msg" id="loginError"></div>
            <div class="form-group">
                <label for="loginUsername">账号</label>
                <input type="text" id="loginUsername" placeholder="admin" value="admin" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="loginPassword">密码</label>
                <input type="password" id="loginPassword" placeholder="输入管理员密码" autocomplete="current-password">
            </div>
            <button class="btn-save" id="btnLogin" style="justify-content: center; width: 100%; margin-top: 8px;">
                登录并继续
            </button>
        </div>

        <!-- 快速收藏表单（已登录时展示） -->
        <form id="quickAddView" class="content" style="display: none;" onsubmit="return false;">
            <div class="error-msg" id="addError"></div>

            <div class="form-group">
                <label for="siteUrl">网站地址 *</label>
                <div class="url-input-wrap">
                    <input type="text" id="siteUrl" placeholder="https://example.com" required>
                    <button type="button" class="btn-sub" id="btnRefetch">重新抓取</button>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group" style="flex: 1.4;">
                    <label for="siteName">网站名称 *</label>
                    <input type="text" id="siteName" placeholder="例如：GitHub" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="siteCategory">归属分类 *</label>
                    <select id="siteCategory" required>
                        <option value="">加载中...</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>网站图标</label>
                <div class="icon-bar">
                    <div class="icon-box" id="iconBox">
                        <span class="emoji" id="iconFallback">🌐</span>
                        <img id="iconImg" src="" alt="icon" style="display: none;">
                    </div>
                    <div class="icon-meta">
                        <span class="icon-meta-status" id="iconStatus">等待解析...</span>
                        <input type="text" class="icon-meta-input" id="siteIcon" placeholder="图标路径或 Emoji">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="siteDesc">网站描述</label>
                <textarea id="siteDesc" placeholder="简短介绍此网站的功能与用途..."></textarea>
            </div>

            <div class="form-group">
                <label>选择标签 (可选)</label>
                <div class="tag-list" id="tagList">
                    <span style="font-size: 12px; color: #a0aec0;">加载标签中...</span>
                </div>
            </div>

            <div class="form-row" style="align-items: center; margin-top: 2px;">
                <label class="checkbox-label">
                    <input type="checkbox" id="siteFeatured"> 设为推荐精选
                </label>
                <div style="flex: 1; text-align: right; display: flex; align-items: center; justify-content: flex-end; gap: 8px;">
                    <span style="font-size: 12px; color: #718096;">排序权重:</span>
                    <input type="number" id="siteSort" value="0" style="width: 60px; padding: 4px 8px; font-size: 12px; text-align: center;">
                </div>
            </div>
        </form>

        <!-- 成功反馈展示 -->
        <div id="splashView" class="splash-overlay">
            <div class="splash-icon">✓</div>
            <h2 style="font-size: 18px; color: #2d3748;">收藏成功！</h2>
            <p id="splashDesc" style="font-size: 13px; color: #718096; line-height: 1.6;">网站已成功添加至导航站。</p>
            <div style="display: flex; gap: 10px; margin-top: 8px;">
                <button type="button" class="btn-cancel" id="btnCloseNow">立即关闭 (Esc)</button>
                <a href="/" target="_blank" class="btn-sub" style="text-decoration: none; display: flex; align-items: center;">打开主页</a>
            </div>
        </div>

        <div class="footer" id="quickAddFooter" style="display: none;">
            <button type="button" class="btn-cancel" id="btnCancel">取消 (Esc)</button>
            <button type="button" class="btn-save" id="btnSave">
                <span>保存并关闭</span>
            </button>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/quick-add.js"></script>
</body>
</html>
