name = "dognav"
main = "cloudflare/src/index.js"
compatibility_date = "2025-06-25"

[assets]
directory = "./public"
binding = "ASSETS"
# Route every request through the Worker first so the security-header
# middleware also covers static asset responses (which it re-fetches via
# the ASSETS binding and wraps).
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "dognav"
# Same dognav D1 database as cloudflare/wrangler.toml; cloudflare/deploy.js
# keeps the database_id in both files in sync on each deploy.
database_id = "84b114ec-d76d-47cb-92cb-0e807a41679e"
